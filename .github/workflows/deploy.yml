name: Deploy Public Website and Build 6 APK to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify Bing IndexNow of Deployment
        run: |
          curl -s -i -X POST -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "homegrocery.online",
              "key": "175fed07c749484a8e3c341a2fa1de1e",
              "keyLocation": "https://homegrocery.online/175fed07c749484a8e3c341a2fa1de1e.txt",
              "urlList": [
                "https://homegrocery.online/",
                "https://homegrocery.online/privacy",
                "https://homegrocery.online/sitemap.xml",
                "https://homegrocery.online/llms.txt"
              ]
            }' https://api.indexnow.org/indexnow || true
